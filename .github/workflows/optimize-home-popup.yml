name: Optimize homepage popup
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'images/SeeAfrica.jpg'
      - '.github/workflows/optimize-home-popup.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          im = ImageOps.exif_transpose(Image.open('images/SeeAfrica.jpg')).convert('RGB')
          im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
          im.save('images/SeeAfrica-popup.webp', 'WEBP', quality=90, method=6)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/SeeAfrica-popup.webp
          if ! git diff --cached --quiet; then
            git commit -m "Compress homepage popup image"
            git push
          fi
